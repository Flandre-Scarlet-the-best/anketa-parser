name: Секреты

# Проверяются новые коммиты PR, весь диапазон push и группа слияния.
# Полная история нужна только для доказанного охвата: неглубокий клон
# отвергается самой проверкой.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Секреты в изменениях и истории Git
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Получить полную историю без сохранения учётных данных
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Установить закреплённый Gitleaks с проверкой SHA256
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tools"
          cd "$tools"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256sum --check <<'CHECKSUMS'
          551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz
          CHECKSUMS
          tar -xzf gitleaks.tar.gz -C "$tools" gitleaks
          chmod +x "$tools/gitleaks"
          echo "$tools" >> "$GITHUB_PATH"
          "$tools/gitleaks" version

      - name: Самопроверка проверки на синтетических фикстурах
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks/gitleaks
        run: python -m unittest discover -s .github/scripts -p 'test_check_gitleaks.py' -v

      - name: Проверить диапазон события закреплённым Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python .github/scripts/check_gitleaks.py \
            --event-name "$EVENT_NAME" \
            --event-path "$EVENT_PATH" \
            --repo . \
            --binary "$RUNNER_TEMP/gitleaks/gitleaks" \
            --report-dir "$RUNNER_TEMP/gitleaks-report"
