name: Доверенный контракт описания PR
# Код head не скачивается и не исполняется; данные события не становятся командами.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Исполняется только точный base SHA; токен read-only, данные PR передаются через env.
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body-trusted:
    name: Доверенная структура PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Получить доверенный валидатор
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Проверить опубликованные описание и журнал валидатором base
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/check_coderabbit_comment.py
