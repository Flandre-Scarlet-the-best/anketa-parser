name: Публикация покрытия в Codecov

# Доверенный издатель. Событие workflow_run использует файл из ветки по
# умолчанию. Она определяет исполняемые валидаторы. Исходники измеренной
# ревизии читаются как данные из --repo-root source-tree.
# Загрузки используют только Repository Secret CODECOV_TOKEN без GitHub Environment.
# Издатель должен находиться в ветке по умолчанию для запуска workflow_run.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Валидаторы исполняются из ветки по умолчанию; измеренные исходники читаются как данные. Секрет доступен только проверке токена и загрузкам доверенного издателя.
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Публикация покрытия
    # Публикуются только доверенные источники: успешный push в ветку по умолчанию
    # и успешный PR из этого же репозитория. Ветка проверяется явно: для события
    # push GitHub берёт определение CI из запушенной ревизии, поэтому фильтр
    # `branches` в файле ветки по умолчанию не ограничивает событие из другой
    # ветки. fork PR не имеет секретов, а merge_group может содержать изменения
    # внешнего PR, поэтому там привилегированная загрузка не выполняется
    # (см. задание not-published).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      ((github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Проверить наличие CODECOV_TOKEN в Repository Secrets
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CODECOV_TOKEN}" ]]; then
            echo "::error::Отсутствует CODECOV_TOKEN. Добавьте токен Codecov в Repository Secrets этого репозитория: Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi

      # Доверенные скрипты и конфигурация берутся из ветки по умолчанию.
      - name: Получить доверенные валидаторы из ветки по умолчанию
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Исходники той же ревизии, что измерил CI: только данные для --repo-root.
      # Ничего из этого каталога не исполняется: команды ниже запускают скрипты
      # из текущего checkout по относительному пути .github/scripts.
      - name: Получить исходники измеренной ревизии как данные
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: source-tree
          persist-credentials: false
          lfs: false
          submodules: false

      # source-tree приходит из измеренной ревизии. Перед чтением
      # проверяется, что в нём нет механизмов исполнения и выхода за пределы
      # каталога (хуки, сабмодули, LFS-указатели, симлинки наружу).
      - name: Проверить целостность source-tree
        env:
          SOURCE_TREE: source-tree
        run: |
          set -uo pipefail
          fail() { echo "::error::source-tree отклонён: $1"; exit 1; }
          [[ -d "${SOURCE_TREE}" ]] || fail "каталог отсутствует"
          hooks=$(find "${SOURCE_TREE}/.git/hooks" -maxdepth 1 -type f ! -name '*.sample' 2>/dev/null | wc -l)
          (( hooks == 0 )) || fail "найдены git-хуки: ${hooks}"
          [[ ! -e "${SOURCE_TREE}/.gitmodules" ]] || fail "сабмодули не допускаются"
          git lfs version >/dev/null || fail "Git LFS недоступен для проверки указателей"
          lfs=$(
            find "${SOURCE_TREE}" -path "${SOURCE_TREE}/.git" -prune -o -type f -size -1024c -print0 |
              while IFS= read -r -d '' file; do
                [[ -r "$file" ]] || exit 1
                IFS= read -r header < "$file" || continue
                case "${header%$'\r'}" in
                  'version https://git-lfs.github.com/spec/v1'|'version https://hawser.github.com/spec/v1'|'version http://git-media.io/v/2')
                    if git lfs pointer --check --file="$file"; then
                      printf '1\n'
                    fi
                    ;;
                esac
              done | wc -l
          ) || fail "не удалось проверить LFS-указатели"
          (( lfs == 0 )) || fail "найдены LFS-указатели: ${lfs}"
          root=$(cd "${SOURCE_TREE}" && pwd -P) || fail "не удалось определить корень"
          outside=0
          while IFS= read -r link; do
            target=$(readlink -f "${link}" 2>/dev/null) || { outside=$((outside + 1)); continue; }
            case "${target}" in
              "${root}"|"${root}"/*) ;;
              *) outside=$((outside + 1)) ;;
            esac
          done < <(find "${SOURCE_TREE}" -type l 2>/dev/null)
          (( outside == 0 )) || fail "символические ссылки вне source-tree: ${outside}"
          echo "source-tree проверен: хуков, сабмодулей, LFS-указателей и внешних симлинков нет"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'

      # Версия обязана совпадать с пином в requirements.txt: валидатор сверяет
      # исполняемые строки парсером того же coverage, что породил отчёт, и любое
      # расхождение версий диагностируется как ошибка. Совпадение литералов и
      # отсутствие `pip install -r` в этом задании проверяются тестом.
      - name: Установить закреплённый coverage
        run: python -m pip install --disable-pip-version-check coverage==7.17.4

      # Идентичность публикации проверяется явно: событие, ровно один PR,
      # совпадение его head SHA с head_sha запуска, совпадение репозитория.
      # Для push номер PR не подставляется. При неоднозначности — отказ.
      - name: Проверить идентичность ревизии и PR
        id: identity
        env:
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_COUNT: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
        run: |
          set -uo pipefail
          fail() { echo "::error::Публикация отклонена: $1"; exit 1; }
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || fail "некорректный head_sha '${HEAD_SHA}'"
          [[ "${HEAD_REPO}" == "${REPOSITORY}" ]] || fail "head_repository '${HEAD_REPO}' не совпадает с '${REPOSITORY}'"
          pr=""
          case "${RUN_EVENT}" in
            push)
              [[ -z "${PR_NUMBER}" ]] || fail "для push номер PR не подставляется, получено '${PR_NUMBER}'"
              ;;
            pull_request)
              count=$(python -c 'import json,sys;print(len(json.loads(sys.argv[1])))' "${PR_COUNT}") || fail "не удалось разобрать список PR"
              (( count == 1 )) || fail "ожидался ровно один PR, получено ${count}: идентичность неоднозначна"
              [[ "${PR_SHA}" == "${HEAD_SHA}" ]] || fail "head.sha PR '${PR_SHA}' не совпадает с head_sha '${HEAD_SHA}'"
              [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] || fail "некорректный номер PR '${PR_NUMBER}'"
              pr="${PR_NUMBER}"
              ;;
            *)
              fail "событие '${RUN_EVENT}' не публикуется"
              ;;
          esac
          {
            echo "pr=${pr}"
            echo "commit=${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Публикация для события ${RUN_EVENT}: коммит ${HEAD_SHA}, PR '${pr:-нет}'"

      - name: Получить отчёт покрытия unit-тестов .NET
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-coverage-unit
          path: coverage/dotnet-unit
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Получить отчёт покрытия Docker-тестов .NET
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-coverage-docker
          path: coverage/dotnet-docker
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Получить отчёт покрытия Python (Linux)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-coverage-linux
          path: coverage/python-linux
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Получить отчёт покрытия Python (Windows)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-coverage-windows
          path: coverage/python-windows
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Сверить измеренную ревизию во всех отчётах
        env:
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          actual=$(git -C source-tree rev-parse HEAD)
          if [[ "$actual" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::Исходники не соответствуют SHA публикации"
            exit 1
          fi
          for report in coverage/{dotnet-unit,dotnet-docker,python-linux,python-windows}; do
            manifest="$report/measured-commit.txt"
            if [[ ! -f "$manifest" ]] || ! printf '%s' "$actual" | cmp -s "$manifest" -; then
              echo "::error::Отчёт $report не подтверждает измерение ревизии $actual"
              exit 1
            fi
          done

      # Артефакты и исходники читают валидаторы из ветки по умолчанию.
      # Происхождение подтверждают номер запуска CI и сверка SHA выше.
      - name: Проверить отчёт unit-покрытия .NET
        run: >-
          python .github/scripts/check_dotnet_coverage.py coverage/dotnet-unit unit --repo-root source-tree
          --require-normalized --instrumented-report coverage/dotnet-unit/instrumented.xml

      - name: Проверить отчёт покрытия Docker-тестов .NET
        run: >-
          python .github/scripts/check_dotnet_coverage.py coverage/dotnet-docker docker --repo-root source-tree
          --require-normalized --instrumented-report coverage/dotnet-docker/instrumented.xml

      - name: Проверить отчёт покрытия Python (Linux)
        run: python .github/scripts/check_python_coverage_report.py --report coverage/python-linux/lcov.info --platform linux --repo-root source-tree

      - name: Проверить отчёт покрытия Python (Windows)
        run: python .github/scripts/check_python_coverage_report.py --report coverage/python-windows/lcov.info --platform windows --repo-root source-tree

      # Загружаются ровно четыре явных файла, поэтому плагины загрузчика не нужны:
      # `disable_search` отключает только поиск файлов, а плагин pycoverage искал бы
      # `.coverage` в дереве измеренной ревизии и мог бы исполнить её код.
      # `root_dir` направляет список файлов network-секции в измеренное дерево:
      # основной checkout содержит ветку по умолчанию, а не измеренную ревизию.
      - name: Опубликовать покрытие unit-тестов .NET
        id: upload-dotnet-unit
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/dotnet-unit/dotnet.cobertura.xml
          flags: dotnet-unit
          name: dotnet-unit
          disable_search: true
          root_dir: source-tree
          plugins: noop
          handle_no_reports_found: false
          fail_ci_if_error: true
          version: v11.3.2
          cleanup: true
          override_commit: ${{ steps.identity.outputs.commit }}
          override_branch: ${{ github.event.workflow_run.head_branch }}
          override_pr: ${{ steps.identity.outputs.pr }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Опубликовать покрытие Docker-тестов .NET
        id: upload-dotnet-docker
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/dotnet-docker/dotnet.cobertura.xml
          flags: dotnet-docker
          name: dotnet-docker
          disable_search: true
          root_dir: source-tree
          plugins: noop
          handle_no_reports_found: false
          fail_ci_if_error: true
          version: v11.3.2
          cleanup: true
          override_commit: ${{ steps.identity.outputs.commit }}
          override_branch: ${{ github.event.workflow_run.head_branch }}
          override_pr: ${{ steps.identity.outputs.pr }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Опубликовать покрытие Python (Linux)
        id: upload-python-linux
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/python-linux/lcov.info
          flags: python-linux
          name: python-linux
          disable_search: true
          root_dir: source-tree
          plugins: noop
          handle_no_reports_found: false
          fail_ci_if_error: true
          version: v11.3.2
          cleanup: true
          override_commit: ${{ steps.identity.outputs.commit }}
          override_branch: ${{ github.event.workflow_run.head_branch }}
          override_pr: ${{ steps.identity.outputs.pr }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Опубликовать покрытие Python (Windows)
        id: upload-python-windows
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/python-windows/lcov.info
          flags: python-windows
          name: python-windows
          disable_search: true
          root_dir: source-tree
          plugins: noop
          handle_no_reports_found: false
          fail_ci_if_error: true
          version: v11.3.2
          cleanup: true
          override_commit: ${{ steps.identity.outputs.commit }}
          override_branch: ${{ github.event.workflow_run.head_branch }}
          override_pr: ${{ steps.identity.outputs.pr }}
          token: ${{ secrets.CODECOV_TOKEN }}

      # Четыре загрузки не являются одной транзакцией. Сводка строится по
      # фактическому результату шагов: предупреждение о частичной публикации истинно
      # только при хотя бы одной успешной загрузке, иначе это ошибка до
      # публикации (измерение, валидация или сеть) и ничего не опубликовано.
      - name: Сводка публикации покрытия
        if: always()
        env:
          OUTCOME_UNIT: ${{ steps.upload-dotnet-unit.outcome }}
          OUTCOME_DOCKER: ${{ steps.upload-dotnet-docker.outcome }}
          OUTCOME_LINUX: ${{ steps.upload-python-linux.outcome }}
          OUTCOME_WINDOWS: ${{ steps.upload-python-windows.outcome }}
        run: |
          set -uo pipefail
          succeeded=""
          failed=""
          for pair in "dotnet-unit:${OUTCOME_UNIT}" "dotnet-docker:${OUTCOME_DOCKER}" "python-linux:${OUTCOME_LINUX}" "python-windows:${OUTCOME_WINDOWS}"; do
            flag="${pair%%:*}"
            outcome="${pair#*:}"
            if [[ "${outcome}" == "success" ]]; then
              succeeded="${succeeded} ${flag}"
            else
              failed="${failed} ${flag}(${outcome:-unknown})"
            fi
          done
          successes=$(wc -w <<< "${succeeded}")
          echo "Успешных загрузок: ${successes} из 4"
          echo "Успешно:${succeeded:- нет}"
          echo "Неуспешно:${failed:- нет}"
          if (( successes == 4 )); then
            echo "Публикация завершена: все 4 отчёта этого запуска приняты Codecov."
          elif (( successes > 0 )); then
            echo "::warning::Частичная публикация: принято ${successes} из 4 отчётов этого запуска. after_n_builds считает обработанные загрузки для коммита, а не уникальные флаги, поэтому наличие статусов не доказывает полноту четырёх групп, а их отсутствие не означает провал."
          else
            echo "::error::Ни один шаг не подтвердил успешную загрузку: ошибка могла возникнуть до публикации или после приёма отчёта с потерянным ответом. Состояние публикации неизвестно, поэтому отсутствие успешных шагов не называется отсутствием публикации."
          fi

      - name: Отметить отменённое выполнение
        if: cancelled()
        run: |
          echo "::warning::Выполнение отменено или прервано по таймауту: состояние публикации неизвестно, часть отчётов могла не загрузиться. Повторите запуск, чтобы получить полный набор из 4 отчётов."

  not-published:
    name: Публикация покрытия не выполнялась
    # Диагностический статус для всех остальных случаев: fork PR, merge_group,
    # push не в ветку по умолчанию, неуспешный или отменённый запуск CI. Он не
    # выдаёт пропуск за успех.
    if: >-
      !(github.event.workflow_run.conclusion == 'success' &&
        ((github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
         (github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository)))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Объяснить, почему покрытие не публиковалось
        env:
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "Событие запуска: ${RUN_EVENT}"
          echo "Итог запуска: ${RUN_CONCLUSION}"
          echo "Репозиторий измеренной ревизии: ${HEAD_REPO}"
          echo "Основной репозиторий: ${REPOSITORY}"
          echo "::notice::Покрытие не публиковалось. Причины: публикуются только успешный push в ветку по умолчанию и успешный PR из этого же репозитория; fork PR не имеет доступа к секретам, merge_group может содержать изменения внешнего PR, push в другую ветку не относится к опубликованной ревизии, а неуспешный запуск не даёт доверенных отчётов."
