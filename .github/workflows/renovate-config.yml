name: Политика Renovate

# Проверяется только изменение политики обновлений и manifests, которые она
# покрывает: строгий валидатор, реальное извлечение и расчёт веток.
on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml
      - .github/scripts/check_renovate.py
      - .github/scripts/test_check_renovate.py
      - Directory.Packages.props
      - global.json
      - .config/dotnet-tools.json
      - .github/scripts/requirements.txt
      - Dockerfile
      - compose.yaml
      - .github/workflows/*.yml
      - .github/workflows/*.yaml
  push:
    branches: [main]
    paths:
      - renovate.json
  workflow_dispatch:

permissions:
  contents: read

env:
  # Официальный образ закреплён digest манифеста: версия и содержимое
  # инструмента не зависят от изменяемого тега.
  RENOVATE_IMAGE: renovate/renovate:44.251.0@sha256:64adaabe8ee3e34820c2b044b5f87e281aa278bf53e5d76df2ce800f9cc9407a

jobs:
  renovate-config:
    name: Конфигурация и ветки Renovate
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Проверить версию закреплённого образа
        run: |
          docker run --rm --entrypoint /usr/local/sbin/renovate "$RENOVATE_IMAGE" --version | grep -Fx '44.251.0'

      - name: Строгая проверка конфигурации официальным валидатором
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            --entrypoint sh "$RENOVATE_IMAGE" \
            -c "python3 .github/scripts/check_renovate.py validate --node '' --renovate /usr/local/sbin/renovate --validator /usr/local/sbin/renovate-config-validator"

      - name: Реальное извлечение по всем поддерживаемым менеджерам
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            --entrypoint sh "$RENOVATE_IMAGE" \
            -c "python3 .github/scripts/check_renovate.py extract --node '' --root . --renovate /usr/local/sbin/renovate"

      - name: Расчёт веток на изолированных фикстурах и отрицательный контроль
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            --entrypoint sh "$RENOVATE_IMAGE" \
            -c "python3 .github/scripts/check_renovate.py fixtures --node '' --root . --renovate /usr/local/sbin/renovate"

      - name: Самопроверка проверки на синтетических данных
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            --entrypoint sh "$RENOVATE_IMAGE" \
            -c "python3 -m unittest discover -s .github/scripts -p 'test_check_renovate.py' -v"