name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  contracts:
    name: Контракты агента
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
      - name: Установить зависимости проверки контрактов
        run: python -m pip install -r .github/scripts/requirements.txt
      - name: Проверить валидаторы и их регрессионные сценарии
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Проверить линтинг и форматирование Python
        run: |
          ruff check .github/scripts
          ruff format --check .github/scripts
      - name: Проверить типы Python и охват файлов
        run: |
          basedpyright --project .github/pyrightconfig.json
          basedpyright --project .github/pyrightconfig.json --outputjson > "$RUNNER_TEMP/basedpyright-report.json"
          python - "$RUNNER_TEMP/basedpyright-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          summary = report["summary"]
          print(f"Проанализировано Python-файлов: {summary['filesAnalyzed']}")
          print(
              f"Ошибок типизации: {summary['errorCount']}; "
              f"предупреждений: {summary['warningCount']}"
          )
          if summary["filesAnalyzed"] != 9:
              raise SystemExit("Ожидался анализ всех девяти Python-файлов.")
          PY
      - name: Проверить метаданные skills и локальные ссылки
        run: python .github/scripts/check_skill_contracts.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Восстановить зависимости в locked mode
        run: dotnet restore --locked-mode

      - name: Проверить форматирование и стиль
        run: dotnet format anketa-parser.slnx --verify-no-changes --no-restore

      - name: Собрать решение
        run: dotnet build --no-restore -c Release

      - name: Запустить тесты
        run: dotnet test --no-build -c Release

      - name: Проверить контейнерное описание
        run: docker compose config --quiet
