name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  actions-security:
    name: Безопасность GitHub Actions
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить закреплённые линтеры с проверкой SHA256
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/actions-security"
          mkdir -p "$tools/bin"
          cd "$tools"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' -o zizmor.tar.gz https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' -o shellcheck.tar.gz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          sha256sum --check <<'CHECKSUMS'
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz
          bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b  zizmor.tar.gz
          b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  shellcheck.tar.gz
          CHECKSUMS
          tar -xzf actionlint.tar.gz -C bin actionlint
          tar -xzf zizmor.tar.gz -C bin zizmor
          tar -xzf shellcheck.tar.gz --strip-components=1 -C bin shellcheck-v0.11.0/shellcheck
          echo "$tools/bin" >> "$GITHUB_PATH"
      - name: Проверить версии и все файлы рабочих процессов GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          actionlint -version
          zizmor --version
          shellcheck --version
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          if (( ${#workflows[@]} == 0 )); then
            echo 'Не найдены файлы рабочих процессов GitHub Actions' >&2
            exit 1
          fi
          printf 'Проверяется файл рабочего процесса: %s\n' "${workflows[@]}"
          actionlint -no-color -verbose -shellcheck shellcheck "${workflows[@]}"
          zizmor --offline --strict-collection --no-config --persona regular --format plain --color never --render-links never "${workflows[@]}"

  contracts:
    name: Контракты агента
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt
      - name: Установить зависимости проверки контрактов
        run: python -m pip install -r .github/scripts/requirements.txt
      - name: Проверить валидаторы и их регрессионные сценарии
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Проверить линтинг и форматирование Python
        run: |
          ruff check .github/scripts
          ruff format --check .github/scripts
      - name: Проверить типы Python и охват файлов
        shell: bash
        run: |
          set -euo pipefail
          basedpyright --project .github/pyrightconfig.json --outputjson | tee "$RUNNER_TEMP/basedpyright-report.json"
          python .github/scripts/check_python_coverage.py "$RUNNER_TEMP/basedpyright-report.json" .github/pyrightconfig.json
      - name: Проверить метаданные skills и локальные ссылки
        run: python .github/scripts/check_skill_contracts.py
      - name: Проверить ссылки во всём отслеживаемом Markdown
        run: python .github/scripts/check_markdown_links.py

  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x
          # Кеш ключуется всеми lock-файлами решения: любое изменение зависимостей
          # создаёт новую запись, а неизменённые зависимости восстанавливаются без сети.
          cache: true
          cache-dependency-path: |
            src/**/packages.lock.json
            tests/**/packages.lock.json

      - name: Восстановить зависимости в locked mode
        run: dotnet restore --locked-mode

      - name: Проверить форматирование и стиль
        run: dotnet format anketa-parser.slnx --verify-no-changes --no-restore

      - name: Собрать решение
        run: dotnet build --no-restore -c Release

      - name: Запустить тесты
        run: dotnet test --no-build -c Release

      - name: Проверить контейнерное описание
        run: docker compose config --quiet

      - name: Проверить изолированную PostgreSQL, права и восстановление
        env:
          ANKETAPARSER_DOCKER_TESTS: '1'
        run: dotnet test --project tests/AnketaParser.DockerTests --no-build -c Release
