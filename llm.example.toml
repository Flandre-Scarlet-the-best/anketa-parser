# Скопируйте в llm.toml и выберите один из профилей. Пустое значение отключает Worker.
active_profile = ""

[profiles.router]
engine = "openai"
base_url = "https://router.example.invalid/v1"
model = "vendor/model"
key_env = "LLM_ROUTER_KEY"
# Включайте json_schema и max_completion_tokens только при поддержке маршрутом.
response_mode = "json_object"
token_parameter = "max_tokens"
timeout_seconds = 60
concurrency = 2
temperature = 0.1
max_output_tokens = 768
max_input_chars = 12000
# Число резервируемых HTTP-запросов за сутки UTC.
daily_request_limit = 100

[profiles.llama-server]
engine = "llama_server"
base_url = "http://127.0.0.1:8080/v1"
model = "local-model"
response_mode = "llama_schema"
timeout_seconds = 180
max_output_tokens = 768

[profiles.native]
engine = "native"
model = "local-model"
# Относительный путь считается от llm.toml.
gguf_path = "models/model.gguf"
context_tokens = 8192
max_output_tokens = 768
timeout_seconds = 180
# 0 — автоматический выбор потоков CPU движком.
threads = 0
gpu_layers = 0
