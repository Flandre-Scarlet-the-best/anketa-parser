# anketa-parser: инфраструктурный хост и PostgreSQL.
#
# По умолчанию порты не публикуются, PostgreSQL доступен через сеть Compose,
# у хоста нет HTTP или административного API. Для отладки БД включите loopback override:
#
#   docker compose -f compose.yaml -f compose.debug.yaml up -d
#
# Пароль по умолчанию — заглушка для локальной разработки. Задайте собственный
# через .env, исключённый из Git, при использовании за пределами локальной среды.

name: anketa-parser

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anketa_parser}
      POSTGRES_USER: ${POSTGRES_USER:-anketa_parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    volumes:
      # PostgreSQL 18 хранит PGDATA в /var/lib/postgresql/18/docker; том монтируется
      # в объявленный образом родительский каталог.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  host:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: anketa-parser-host:local
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      ANKETAPARSER_Host__InstanceName: ${ANKETAPARSER_INSTANCE_NAME:-anketa-parser}
      ANKETAPARSER_Host__ShutdownTimeoutSeconds: "20"
      ANKETAPARSER_Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-anketa_parser};Username=product_runtime;Password=\"${PRODUCT_RUNTIME_PASSWORD:-local-runtime-password}\";Timeout=5;Command Timeout=5"
      ANKETAPARSER_Database__Required: "true"
      ANKETAPARSER_Backup__Directory: /backups
      ANKETAPARSER_Backup__IntervalSeconds: ${BACKUP_INTERVAL_SECONDS:-86400}
      ANKETAPARSER_Logging__Console__FormatterName: json
    security_opt:
      - no-new-privileges:true
    volumes:
      - backups:/backups:ro
    stop_grace_period: 30s
    networks:
      - backend

  maintenance:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: Dockerfile
      target: maintenance
    image: anketa-parser-maintenance:local
    init: true
    environment:
      ANKETAPARSER_Database__ConnectionString: "Host=postgres;Database=${POSTGRES_DB:-anketa_parser};Username=product_migrator;Password=\"${PRODUCT_MIGRATION_PASSWORD:-local-migration-password}\""
      ANKETAPARSER_Provision__MigrationPassword: ${PRODUCT_MIGRATION_PASSWORD:-local-migration-password}
      ANKETAPARSER_Provision__RuntimePassword: ${PRODUCT_RUNTIME_PASSWORD:-local-runtime-password}
      ANKETAPARSER_Provision__BackupPassword: ${PRODUCT_BACKUP_PASSWORD:-local-backup-password}
      ANKETAPARSER_Backup__ConnectionString: "Host=postgres;Database=${POSTGRES_DB:-anketa_parser};Username=product_backup;Password=\"${PRODUCT_BACKUP_PASSWORD:-local-backup-password}\""
      ANKETAPARSER_Backup__Directory: /backups
      ANKETAPARSER_Backup__IntervalSeconds: ${BACKUP_INTERVAL_SECONDS:-86400}
      ANKETAPARSER_Backup__MaxBytes: ${BACKUP_MAX_BYTES:-10737418240}
    command: [storage, schema]
    volumes:
      - backups:/backups
    networks: [backend]
    security_opt: [no-new-privileges:true]

  backup:
    build:
      context: .
      dockerfile: Dockerfile
      target: maintenance
    image: anketa-parser-maintenance:local
    restart: unless-stopped
    init: true
    environment:
      ANKETAPARSER_Backup__ConnectionString: "Host=postgres;Database=${POSTGRES_DB:-anketa_parser};Username=product_backup;Password=\"${PRODUCT_BACKUP_PASSWORD:-local-backup-password}\""
      ANKETAPARSER_Backup__Directory: /backups
      ANKETAPARSER_Backup__IntervalSeconds: ${BACKUP_INTERVAL_SECONDS:-86400}
      ANKETAPARSER_Backup__MaxBytes: ${BACKUP_MAX_BYTES:-10737418240}
    command: [storage, backup-daemon]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backups:/backups
    networks: [backend]
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
  backups:

networks:
  backend:
