target-version = "py315"

[lint]
# S — security-проверки Bandit; SIM, PLW1510 и RUF012 дополняют аудит
# упрощений, явного check= в subprocess и изменяемых значений класса.
# FLY002, FURB167 и ISC004 закрывают остаток первоначального аудита:
# f-строки вместо статического str.join, полные имена флагов re вместо
# однобуквенных алиасов и пропущенная запятая в литерале коллекции.
# Всё семейство ISC не подключается: ISC003 требует неявной конкатенации
# строк, а BasedPyright сообщает на неё reportImplicitStringConcatenation.
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "FLY002",
    "FURB167",
    "I",
    "ISC004",
    "PLW1510",
    "RUF012",
    "S",
    "SIM",
    "UP",
]
